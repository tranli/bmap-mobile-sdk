plugins {
    id 'java-library'
    id 'maven-publish'
}

group = "com.github.tranli"
version = "5.2.0"


publishing {
    publications {
        release(MavenPublication) {
            artifactId = "bmap-mobile-sdk"

            // ✅ Publish the AAR file
            artifact("libs/bmap-mobile-sdk-5.2.0.aar")
        }
    }
}
